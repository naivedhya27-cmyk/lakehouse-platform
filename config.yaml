# ai_sdr pipeline config.
# Loaded by ai_sdr.config.load_config().

max_words: 65
target_subject_words_max: 5
min_critique_score: 8
rewrite_passes: 1
sender_first_name: "navi"
loom_url_placeholder: "{LOOM_URL}"

# Set to true and export ANTHROPIC_API_KEY to use the LLM generator.
# When false (default), the deterministic template path is used and the
# pipeline runs offline with no API key required.
use_llm: false
